services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anduin
      POSTGRES_PASSWORD: anduin
      POSTGRES_DB: anduin
    ports:
      - "5432:5432"
    volumes:
      - anduin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anduin -d anduin"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anduin-pgdata:
